# Configuracion de la conexion a MySQL para ticketpremiumDB.
# Cualquiera de estos valores puede sobreescribirse en runtime con la
# variable de entorno equivalente (ver ConexionBD.java):
#   TICKETPREMIUM_DB_HOST
#   TICKETPREMIUM_DB_PORT
#   TICKETPREMIUM_DB_NAME
#   TICKETPREMIUM_DB_USER
#   TICKETPREMIUM_DB_PASSWORD
#
# Asi el WAR es portable: la misma build corre en cualquier maquina
# cambiando solo las variables de entorno del servidor Payara/GlassFish.

db.host=localhost
db.port=3306
db.name=ticketpremiumDB
db.user=root
db.password=admin2002
