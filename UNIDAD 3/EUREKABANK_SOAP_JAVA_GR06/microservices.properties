# ================================================================
# CONFIGURACION DE ENDPOINTS - EUREKABANK MICROSERVICIOS
# Por defecto, los cinco WAR se despliegan juntos en un Payara local :8080.
# Para una LAN, sustituye "localhost" en CADA URL por la IP del equipo que
# aloja ese servicio. Las seis propiedades se configuran por separado.
# ================================================================

# Microservicio 1: Autenticación (WSLogin)
ms.autenticacion=http://localhost:8080/ms-autenticacion/WSLogin

# Microservicio 2: Consultas (WSConsulta y WSMovimiento)
ms.consulta=http://localhost:8080/ms-consulta/WSConsulta
ms.movimiento=http://localhost:8080/ms-consulta/WSMovimiento

# Microservicio 3: Depósitos (WSDeposito)
ms.deposito=http://localhost:8080/ms-deposito/WSDeposito

# Microservicio 4: Retiros (WSRetiro)
ms.retiro=http://localhost:8080/ms-retiro/WSRetiro

# Microservicio 5: Transferencias (WSTransferencia)
ms.transferencia=http://localhost:8080/ms-transferencia/WSTransferencia
